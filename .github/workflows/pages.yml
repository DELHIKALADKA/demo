# Publish the PageSnap web app to GitHub Pages.
#
# What is deployed: the browser-only app in `docs/`, assembled by `docs/build_site.py`
# into `_site/`. That app does all of its work on the visitor's own device, which is
# what lets it run on GitHub Pages at all - Pages is static hosting and can serve no
# Python or Node backend.
#
# The `prototype/` folder (FastAPI + the yt-dlp link importer) is deliberately NOT
# deployed: it needs a server, so it cannot run here. See DEPLOYMENT.md.
#
# Before publishing, this runs the app's own tests against the very code being
# deployed. A failure stops the deployment.

name: Deploy PageSnap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # the Run workflow button in the Actions tab

# Pages needs these; nothing else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress runs are not cancelled, so a release that has
# started always finishes rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test the app, then build the site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # The fixtures are generated videos with known page positions, so they are built
      # here rather than committed. imageio-ffmpeg brings its own ffmpeg binary, so the
      # test does not depend on what the runner image happens to ship. pypdf and Pillow
      # read the downloaded PDF back in the browser test.
      - name: Install the test dependencies
        run: python -m pip install --upgrade pip numpy pillow imageio-ffmpeg pypdf

      # puppeteer-core only - it drives the Chrome the runner already has, and downloads
      # no browser of its own. The app itself still has no dependencies at all.
      - name: Install the browser-test dependency
        run: npm ci --prefix docs

      # Reads the repository's Pages configuration, so the build knows the path the
      # site is published under (/demo/ for this project) instead of assuming it.
      - name: Read the Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the ground-truth fixture videos
        run: python engine/tests/make_fixtures.py

      - name: Build the test videos (every container the app makes a claim about)
        run: python docs/test/make_media.py

      # The engine against the ground-truth fixtures, the sample video the page offers,
      # and the PDF writer's page order and filenames.
      - name: Run the engine, sample and PDF tests
        run: node docs/test/run.mjs

      # The real page in a real browser: decoding, the full-size view, Start over, the
      # file that actually downloads. Skips itself, loudly, if the runner has no browser.
      - name: Run the app in a browser
        run: node docs/test/browser.mjs

      # Also checks that the single-file offline build still contains every element the
      # app asks for - the failure that shipped once already.
      - name: Build the single-file offline copy
        run: python docs/build_single.py

      # A guard that never runs is not a guard: this breaks the built output on purpose,
      # in every way that actually happens (root-absolute paths, a missing asset, a
      # manifest that is not relative) and insists the build refuses to publish it.
      - name: Check that the build refuses broken paths
        run: python docs/test/test_build_guards.py

      - name: Build the deployable site
        run: |
          echo "Publishing under base path: ${{ steps.pages.outputs.base_path }}/"
          python docs/build_site.py --base-path "${{ steps.pages.outputs.base_path }}/"

      # The folder that is about to be published, served under the base path Pages will
      # use and opened in a real browser: every request has to stay under that path, none
      # may fail, and the app has to work end to end from there. This is the check that
      # catches the difference between localhost and /<repo>/.
      - name: Check the published site under its base path
        run: node docs/test/site.mjs --no-build --base "${{ steps.pages.outputs.base_path }}/"

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub Pages has two ways of publishing, and this job has to cope with both
      # rather than turning red and looking like a broken deployment:
      #
      #   Source: GitHub Actions      -> this workflow uploads _site/ and publishes it
      #   Source: Deploy from a branch -> GitHub publishes the folder itself and this
      #                                  workflow has nothing to publish (still fine:
      #                                  the tests above ran)
      #   Source: Deploy from a branch, folder "/" -> the repository root has no
      #                                  index.html, so GitHub renders README.md and the
      #                                  site looks like a README. That is a real fault
      #                                  and this job fails with the exact setting.
      - name: Check how GitHub Pages publishes
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          source_path=$(gh api "repos/${{ github.repository }}/pages" --jq .source.path 2>/dev/null || echo unknown)
          echo "Pages build type: $build_type   source folder: $source_path"

          if [ "$build_type" = "workflow" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$source_path" = "/docs" ] || [ "$source_path" = "docs" ]; then
            echo "::notice title=Published straight from the branch::Pages is set to 'Deploy from a branch' with the folder $source_path, so GitHub publishes docs/ itself and this workflow has nothing to publish. The app tests in the job above still ran and passed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error title=Pages is publishing the wrong folder::Pages is set to 'Deploy from a branch' with the folder '$source_path'. The repository root has no index.html, so GitHub renders README.md instead of the app. Fix it on Settings -> Pages -> Build and deployment: either set Source to 'GitHub Actions', or keep 'Deploy from a branch' and set the folder to /docs. Nothing is deployed until one of those is done."
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Deploy
        id: deployment
        if: steps.pages_check.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
