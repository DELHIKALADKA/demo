# Publish the PageSnap web app to GitHub Pages.
#
# What is deployed: the browser-only app in `docs/`, assembled by `docs/build_site.py`
# into `_site/`. That app does all of its work on the visitor's own device, which is
# what lets it run on GitHub Pages at all - Pages is static hosting and can serve no
# Python or Node backend.
#
# The `prototype/` folder (FastAPI + the yt-dlp link importer) is deliberately NOT
# deployed: it needs a server, so it cannot run here. See DEPLOYMENT.md.
#
# Before publishing, this runs the project's own engine test suite against the very
# code being deployed: the same five ground-truth videos, checked with the JavaScript
# detector that the browser app uses. A failure stops the deployment.

name: Deploy PageSnap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # the Run workflow button in the Actions tab

# Pages needs these; nothing else is granted.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress runs are not cancelled, so a release that has
# started always finishes rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test the engine, then build the site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The fixtures are generated videos with known page positions, so they are built
      # here rather than committed. imageio-ffmpeg brings its own ffmpeg binary, so the
      # test does not depend on what the runner image happens to ship.
      - name: Install the test dependencies
        run: python -m pip install --upgrade pip numpy pillow imageio-ffmpeg

      # Reads the repository's Pages configuration, so the build knows the path the
      # site is published under (/demo/ for this project) instead of assuming it.
      - name: Read the Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the ground-truth fixture videos
        run: python engine/tests/make_fixtures.py

      - name: Run the browser engine against the same fixtures
        run: node docs/test/run.mjs

      - name: Build the deployable site
        run: |
          echo "Publishing under base path: ${{ steps.pages.outputs.base_path }}/"
          python docs/build_site.py --base-path "${{ steps.pages.outputs.base_path }}/"

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages can only publish when the repository is set to deploy from GitHub
      # Actions. If it is still on "Deploy from a branch", say exactly what to change
      # rather than letting the deployment fail with an opaque 404.
      - name: Check that Pages is set to deploy from GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build type: $build_type"
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=One repository setting is left::Open Settings -> Pages -> Build and deployment -> Source and choose \"GitHub Actions\" (it is currently \"Deploy from a branch\"). Then re-run this workflow: the site will publish to https://${{ github.repository_owner }}.github.io/$(basename ${{ github.repository }})/"
            exit 1
          fi

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
