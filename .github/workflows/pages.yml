# Check the PageSnap web app that GitHub Pages publishes from `main` + `/docs`.
#
# How the site is published: Settings -> Pages -> Build and deployment -> Source is
# "Deploy from a branch", branch `main`, folder `/docs`. On every push to main, GitHub's
# own "pages-build-deployment" workflow publishes the docs/ folder exactly as it is
# committed - there is no build step in between. This workflow deploys nothing, so it
# needs no Pages permissions; it makes sure that what is in docs/ is fit to be served,
# on every pull request into main (before merging publishes it) and on every push to main:
#
#   1. the browser engine finds the right pages in the five ground-truth videos;
#   2. docs/ passes the site checks as it will be served: relative paths only, nothing
#      missing, no server calls, and the offline single-file copy matches the
#      sources (Pages serves the committed copy, so a stale one goes live);
#   3. the real page, served under /demo/ as Pages serves it, works end to end in
#      headless Chrome - and so does the offline copy, opened from disk.
#
# The prototype/ folder (FastAPI + the yt-dlp link importer) is not part of the site:
# it needs a server, so it cannot run on GitHub Pages. See DEPLOYMENT.md.

name: Check the GitHub Pages site (main + /docs)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # the Run workflow button in the Actions tab

# Read-only: this workflow tests, and GitHub's Pages workflow does the publishing.
permissions:
  contents: read

concurrency:
  group: pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test docs/ as GitHub Pages will serve it
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The browser test drives Chrome with the WebSocket client built into Node 22+.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The fixtures are generated videos with known page positions, so they are built
      # here rather than committed. imageio-ffmpeg brings its own ffmpeg binary, so the
      # test does not depend on what the runner image happens to ship.
      - name: Install the test dependencies
        run: python -m pip install --upgrade pip numpy pillow imageio-ffmpeg

      - name: Build the ground-truth fixture videos
        run: python engine/tests/make_fixtures.py

      - name: Run the browser engine against the same fixtures
        run: node docs/test/run.mjs

      - name: Check docs/ exactly as GitHub Pages serves it
        run: python docs/build_site.py --check

      # The runner image ships Google Chrome; requiring it means this step cannot skip.
      - name: Drive the real page in headless Chrome
        env:
          PAGESNAP_REQUIRE_BROWSER: "1"
        run: node docs/test/browser.mjs
