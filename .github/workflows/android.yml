name: Build Android APK

# Every push to the working branch builds the APK, so the first compile problems
# show up here instead of on someone's phone. Pushing a tag also publishes it as
# a release asset, which is what makes a permanent download link possible:
#
#   https://github.com/<owner>/<repo>/releases/latest/download/PageSnap.apk
#
# NOTE: that link is public only if the repository is public. On a private repo
# the release and its assets are visible to you alone - share the .apk file
# itself instead, or make the repository public.

on:
  push:
    branches: ['arena/43b0ced0-demo']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      # Action logs need a GitHub login to read; committing the tail of the log
      # into the branch makes a failed build diagnosable from anywhere.
      - name: Keep the build log when it fails
        if: failure()
        run: |
          tail -c 150000 build.log > ci-build-error.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-build-error.log
          git commit -m "ci: build error log [skip ci]" || true
          git push origin HEAD:arena/43b0ced0-demo || true

      - name: Give the APK a friendly, stable name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PageSnap.apk

      - name: Show how big it is
        run: ls -lh PageSnap.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PageSnap-apk-${{ github.ref_name }}
          path: PageSnap.apk
          if-no-files-found: error

      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PageSnap.apk
          name: PageSnap ${{ github.ref_name }}
          body: |
            **Install on an Android phone:** download `PageSnap.apk` below and open it.
            Android will ask you to allow installing apps from this source — that is
            expected, because this app is not on the Play Store (Play does not allow
            video-downloader apps).

            What it does: give it a video from the phone, or paste an Instagram /
            Facebook / YouTube link. It finds the pages of notes in the video, one
            screenshot each, and saves a PDF. Everything happens on the phone —
            no account, no cloud, no server.
